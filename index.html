<!DOCTYPE html>
<html>
<head>
  <title>WHAT IS HAPPENING</title>

  <style>
    body {
      width: 1600px;
      height: 1200px;
      margin: 0;
      background: repeating-linear-gradient(
        30deg,
        red,
        yellow,
        lime,
        cyan,
        magenta
      );
      font-family: "Comic Sans MS", "Papyrus", cursive;
      overflow: hidden;
    }

    .box {
      position: absolute;
      border: 8px dashed black;
      padding: 10px;
      font-size: 22px;
    }

    .b1 {
      top: 40px;
      left: 900px;
      background: yellow;
      transform: rotate(12deg);
    }

    .b2 {
      top: 300px;
      left: 120px;
      background: hotpink;
      transform: rotate(-20deg);
    }

    .b3 {
      top: 180px;
      left: 600px;
      background: lime;
      transform: rotate(6deg);
    }

    .b4 {
      top: 700px;
      left: 400px;
      background: cyan;
      transform: rotate(-14deg);
    }

    .b5 {
      top: 500px;
      left: 1000px;
      background: orange;
      transform: rotate(25deg);
    }

    h1 {
      position: absolute;
      top: 200px;
      left: 200px;
      font-size: 96px;
      background: red;
      color: yellow;
      border: 15px double lime;
      transform: rotate(-8deg);
      text-shadow: 6px 6px blue;
    }

    button {
      position: absolute;
      top: 100px;
      left: 1100px;
      font-size: 36px;
      background: purple;
      color: cyan;
      border: 10px solid red;
      animation: blink 0.5s infinite;
    }

    img {
      position: absolute;
      top: 600px;
      left: 700px;
      width: 260px;
      border: 12px groove gold;
      transform: rotate(-18deg);
    }

    marquee {
      position: absolute;
      top: 850px;
      left: 0;
      width: 1600px;
      font-size: 42px;
      background: black;
      color: lime;
      border: 6px solid red;
    }

    .price {
      position: absolute;
      top: 50px;
      left: 50px;
      font-size: 72px;
      background: cyan;
      color: red;
      border: 10px dotted purple;
      transform: rotate(9deg);
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body>

  <div class="price">$999 ONLY!!!</div>

  <h1>BUY THIS???</h1>

  <button onclick="alert('STOP CLICKING 😭')">CLICK FAST</button>

  <div class="box b1">This is important maybe</div>
  <div class="box b2">Who placed this here?</div>
  <div class="box b3">Feature??</div>
  <div class="box b4">No alignment detected</div>
  <div class="box b5">Why is this orange</div>

  <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">

  <marquee behavior="alternate" scrollamount="25">
    ❌ NO RESPONSIVENESS ❌ NO DESIGN ❌ PURE CHAOS ❌
  </marquee>

</body>
</html>
